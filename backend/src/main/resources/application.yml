spring:
  application:
    name: sistema-academico-doutrina-ielb
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sistemaAcademicoIELB}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:djonata}
  flyway:
    enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      cookie:
        http-only: true
        same-site: strict
